# VoltShare — deployment
#
#   docker compose up --build          from src/deploy/
#   docker compose logs -f station1    watch the M0 ping
#
# M0 ran MySQL and two station nodes pinging each other. M1 adds coord1,
# running the mock coordinator (vs_mock_coord) so that part A works end
# to end before vs_coord exists. The real coordinators and the back
# office are declared below and commented out; B enables them as
# vs_coord and the Tomcat image appear, replacing the mock coord1.

name: voltshare

services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    environment:
      MYSQL_ROOT_PASSWORD: voltshare
      MYSQL_DATABASE: voltshare
      MYSQL_USER: voltshare
      MYSQL_PASSWORD: voltshare
    # schema.sql lives in contracts/ because it is a shared contract; it is
    # mounted here rather than copied, so there is only one copy to change.
    #
    # The named volume is what makes the data outlive the container. Without it
    # everything sat in the container's writable layer, so a single
    # `docker compose down` destroyed the accounts, the sessions and the
    # notifications — including the presenter's account on the morning of the
    # demo. It also means the two-phase initialisation (temporary server →
    # init scripts → real server) happens once instead of on every `down`.
    #
    # To start genuinely clean — a fresh schema, no rows — the volume has to go
    # too: `docker compose down -v`. That is now a deliberate act rather than a
    # side effect of stopping the stack.
    volumes:
      - mysql-data:/var/lib/mysql
      - ../contracts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    # 60 retries at 5 s = five minutes. Generous on purpose: the first boot on a
    # cold volume measured over six minutes on a developer laptop — InnoDB alone
    # took forty seconds — and with the previous twenty retries the check gave up
    # first, so the stations and the back office refused to start against a
    # database that was merely slow. Every later boot answers in seconds, so the
    # ceiling costs nothing once the volume exists.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pvoltshare"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    networks: [voltshare]

  station1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.erlang
    # One image name for both stations, for the same reason the coordinators
    # share theirs: compose otherwise derives voltshare-station1 and
    # voltshare-station2, and rebuilding one leaves the other on older code.
    # That is not hypothetical — it is how a fixed refusal message went on
    # showing the old wording for two days after the fix was merged.
    image: voltshare-station:local
    container_name: station1
    hostname: station1
    environment:
      NODE_SNAME: vs
      ERL_APP: vs_station
      ERLANG_COOKIE: ${ERLANG_COOKIE:-voltshare}
      STATION_ID: 1
      # PING_TARGET is deliberately unset. It was the M0 connectivity probe,
      # replaced in M1 by COORD_NODES and the real claim client, and left
      # switched on afterwards out of habit: two log lines every three seconds,
      # per station, for a fact nothing reads. That is what buried the station
      # pane during the demo rehearsal — the interesting lines were there, under
      # a thousand pings, and `grep -v ping` only removed the message and left
      # the orphan `=NOTICE REPORT====` headers behind it.
      #
      # `vs_ping` stays in the supervision tree and still answers `ping` calls;
      # without a target it simply never initiates (vs_ping:init/1). To probe
      # connectivity by hand: `PING_TARGET=vs@station2 docker compose up -d
      # station1`, or from a shell `vs_ping:ping('vs@station2')`.
      # M1+
      COORD_NODES: vs@coord1,vs@coord2,vs@coord3
      MYSQL_HOST: mysql
      LEASE_SECONDS: ${LEASE_SECONDS:-900}
      # M4, ws-chargepoint.md §10. Here for the same reason LEASE_SECONDS is:
      # five minutes of tolerance is right on a real site and is five minutes
      # of nothing happening in a demo. `OVERSTAY_GRACE_SECONDS=10 docker
      # compose up -d station1` makes the whole cycle — charge over, grace,
      # overstay, row — fit inside a minute. The station photographs it at
      # boot, so it takes a restart to change, which is deliberate: a session
      # is billed by the rule that was in force when it started.
      OVERSTAY_GRACE_SECONDS: ${OVERSTAY_GRACE_SECONDS:-300}
      # ≥32 bytes: jjwt refuses shorter HS256 keys (B's requirement, kept)
      VOLTSHARE_JWT_SECRET: ${VOLTSHARE_JWT_SECRET:-dev-secret-change-me-0123456789ab}
      # Must mirror the seed rows of contracts/schema.sql for this station:
      # connector ids are globally unique (station 1 owns 1..4).
      # Parametrico solo qui, e solo per la demo: `.env.demo` lo porta a 200 kW così
      # che due auto bastino a rendere visibile il riparto della potenza. Il default
      # resta 350, cioè il sito reale descritto in SCOPE §3.
      SITE_POWER_KW: ${STATION1_SITE_POWER_KW:-350}
      CONNECTORS: "1:150,2:150,3:150,4:50"
      STATION_NAME: "Pisa Centro"
      WS_URL: "ws://localhost:9101/ws/driver"
      TARIFF_CENTS_KWH: 45
    ports:
      - "9101:8080"   # driver WebSocket  (M1)
      - "9201:8081"   # charge point      (M2)
    depends_on:
      mysql:
        condition: service_healthy
    # Two networks, because a real charging site has two and they fail
    # separately: `site1` is the LAN that joins this controller to its chargers,
    # `voltshare` is the uplink to the operator's cluster.
    #
    # This is what makes a station partition demonstrable. `docker network
    # disconnect voltshare_voltshare station1` now cuts the uplink and leaves the
    # site running: the coordinator loses the station, the browser loses it, and
    # the cars keep charging — which is the failure the lease and the node
    # monitor exist for, and the one with the clearest meaning outside this room.
    #
    # With a single network we could not show it. Measured 3/09 before the split:
    # the isolated station went on reporting `charging` while the energy stayed
    # frozen at 34.523 kWh across three samples — the last reading before the
    # cable went quiet, not a car still drawing power.
    networks: [voltshare, site1]

  station2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.erlang
    image: voltshare-station:local
    container_name: station2
    hostname: station2
    environment:
      NODE_SNAME: vs
      ERL_APP: vs_station
      ERLANG_COOKIE: ${ERLANG_COOKIE:-voltshare}
      STATION_ID: 2
      # Unset, same as station1 above.
      COORD_NODES: vs@coord1,vs@coord2,vs@coord3
      MYSQL_HOST: mysql
      LEASE_SECONDS: ${LEASE_SECONDS:-900}
      OVERSTAY_GRACE_SECONDS: ${OVERSTAY_GRACE_SECONDS:-300}
      VOLTSHARE_JWT_SECRET: ${VOLTSHARE_JWT_SECRET:-dev-secret-change-me-0123456789ab}
      # Station 2 owns connectors 5..7 in the seed.
      SITE_POWER_KW: 180
      CONNECTORS: "5:150,6:50,7:50"
      STATION_NAME: "Livorno Port"
      WS_URL: "ws://localhost:9102/ws/driver"
      TARIFF_CENTS_KWH: 42
    ports:
      - "9102:8080"
      - "9202:8081"
    depends_on:
      mysql:
        condition: service_healthy
    # Same split as station1, for the same reason.
    networks: [voltshare, site2]

  # ------------------------------------------- charge points on the site LAN
  #
  # The chargers of Livorno, as containers on `site2` — the station's own
  # network. They are the same `cp.js` the demo scripts run from the host; what
  # changes is *where they are attached*, and that is the whole point.
  #
  # A charge point on the host reaches its station through a published port on
  # the `voltshare` bridge, so isolating the station cut the cars off too. Here
  # the cable is a link on `site2`, which a `docker network disconnect
  # voltshare_voltshare station2` does not touch. The site keeps working while
  # the operator goes blind — the failure we want to show.
  #
  # They are on Livorno and not on Pisa on purpose: Pisa's connectors belong to
  # the presenter (§4 of DEMO.md), and a permanently attached charger there would
  # take the socket that `presenter-cp.sh` needs, answering it 4409.
  #
  # `restart: unless-stopped` is the compose equivalent of the supervision loop
  # in world.sh, and exists for the same reason: a charger that dies and is not
  # replaced leaves the connector `out_of_service` thirty seconds later, and the
  # lobby quietly offers one socket fewer for the rest of the demo.
  cp6: &cp
    build:
      context: ..
      dockerfile: deploy/Dockerfile.emulator
    image: voltshare-emulator:local
    container_name: cp6
    restart: unless-stopped
    environment: &cp_env
      # By service name, not localhost: this is the site LAN, and the station is
      # a host on it.
      CP_URL: ws://station2:8081/ws/cp
      CP_STATION: "2"
      CP_CONNECTOR: "6"
      CP_VEHICLE: "101"
      CP_SOC: "30"
      CP_BATTERY: "60"
      CP_MAX_KW: "50"
    depends_on:
      station2:
        condition: service_started
    networks: [site2]

  cp7:
    <<: *cp
    container_name: cp7
    environment:
      <<: *cp_env
      CP_CONNECTOR: "7"
      CP_VEHICLE: "102"
      CP_SOC: "55"
      CP_BATTERY: "40"
    networks: [site2]

  # ------------------------------------------------------- coordinators (M3)
  #
  # Three replicas of the same image and the same configuration. They differ
  # only by hostname, and that is on purpose: nothing here says which one is
  # in charge.
  #
  # There is no COORD_ID. Bully priority is the position of each node in the
  # sorted COORD_NODES list, which all three already share, so every node
  # computes the same order without being told. A per-node id would be one
  # more thing to configure and one more thing to get wrong — two nodes given
  # the same id would both refuse to yield, and an election that never settles
  # looks nothing like its cause.
  #
  # Highest position wins, so on a healthy start the leader is coord3.
  # `docker kill coord3` is scenario 5 of the demo: coord2 takes over, rebuilds
  # from the stations, and reservations resume by themselves. Charging sessions
  # already running are untouched — the coordinator is not in the path of
  # delivering power, it only decides who may hold a vehicle.
  coord1: &coord
    build:
      context: ..
      dockerfile: deploy/Dockerfile.erlang
    # One image name for all three, deliberately.
    #
    # Without it compose derives a name per service — voltshare-coord1,
    # voltshare-coord2, voltshare-coord3 — and `docker compose build coord1`
    # leaves the other two on yesterday's code. The symptom is nasty to read:
    # the cluster comes up, elects a leader, and then one coordinator answers
    # "unexpected cast" to a message the others consider ordinary. Sharing the
    # tag makes divergence impossible.
    image: voltshare-coord:local
    container_name: coord1
    hostname: coord1
    environment: &coord_env
      NODE_SNAME: vs
      ERL_APP: vs_coord
      ERLANG_COOKIE: ${ERLANG_COOKIE:-voltshare}
      LEASE_SECONDS: ${LEASE_SECONDS:-900}
      CLAIM_GRACE_SECONDS: ${CLAIM_GRACE_SECONDS:-60}
      # The cluster, and with it the quorum arithmetic: 2 of these 3 must be
      # visible for a coordinator to serve at all.
      COORD_NODES: vs@coord1,vs@coord2,vs@coord3
      # Liveness. Three missed beats at one second is a three-second verdict on
      # a partition; Erlang's own net_ticktime would take sixty, and sixty
      # seconds of a minority leader still granting claims is exactly what the
      # quorum rule exists to prevent.
      COORD_HEARTBEAT_MS: ${COORD_HEARTBEAT_MS:-1000}
      COORD_HEARTBEAT_MISSES: ${COORD_HEARTBEAT_MISSES:-3}
      COORD_ELECTION_WAIT_MS: ${COORD_ELECTION_WAIT_MS:-800}
      COORD_REBUILD_TIMEOUT_MS: ${COORD_REBUILD_TIMEOUT_MS:-2000}
      # Where to push stations_update: must match the back office's node name.
      # Every coordinator has it; only the one that is serving actually pushes.
      JINTERFACE_NODE: voltshare_bo@backoffice
      JINTERFACE_MBOX: backoffice
    networks: [voltshare]

  coord2:
    <<: *coord
    container_name: coord2
    hostname: coord2
    environment:
      <<: *coord_env

  coord3:
    <<: *coord
    container_name: coord3
    hostname: coord3
    environment:
      <<: *coord_env

  backoffice:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backoffice
    container_name: backoffice
    hostname: backoffice          # must match JINTERFACE_NODE below
    environment:
      # JInterface. Without these the bridge falls back to its defaults and
      # announces itself as voltshare_bo@localhost, which no coordinator can
      # reach — the node name has to carry the hostname the others resolve.
      # See contracts/erlang-java.md §1.
      JINTERFACE_NODE: voltshare_bo@backoffice
      JINTERFACE_MBOX: backoffice
      COORD_NODES: vs@coord1,vs@coord2,vs@coord3
      VOLTSHARE_ERLANG_COOKIE: ${ERLANG_COOKIE:-voltshare}
      VOLTSHARE_JWT_SECRET: ${VOLTSHARE_JWT_SECRET:-dev-secret-change-me-0123456789ab}
      # Billing (M2). The sweep is what actually prices sessions; the
      # session_closed event only makes it run sooner, so shortening the
      # interval is how the demo shows a cost appear without waiting.
      #
      # There is deliberately no OVERSTAY_CENTS_MIN here. Both tariffs are
      # per station and live in `stations` (schema.sql); an environment
      # variable next to them would be a second source for the same price,
      # and the one that silently won.
      BILLING_SWEEP_SECONDS: ${BILLING_SWEEP_SECONDS:-60}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: voltshare
      DB_USER: voltshare
      DB_PASSWORD: voltshare
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      coord1:
        condition: service_started
    networks: [voltshare]

networks:
  # The operator's network: the cluster, the back office, the database. This is
  # the one a partition is applied to.
  voltshare:
    driver: bridge

  # One LAN per site, joining a station to its own chargers. Nothing else is on
  # them — not the coordinators, not the back office — because in a real
  # deployment nothing else would be: these are cables in a car park.
  #
  # Their existence is what makes `docker network disconnect
  # voltshare_voltshare stationN` a *partition* rather than a power cut. Without
  # them the two links were the same link.
  site1:
    driver: bridge
  site2:
    driver: bridge

volumes:
  # The database survives `docker compose down`. Removing it is `down -v`, and
  # then the next boot replays contracts/schema.sql from scratch.
  mysql-data:
